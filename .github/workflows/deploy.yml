name: Deploy Spring Boot to EC2

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 1. Copiar JAR a la EC2 usando la acción SCP oficial
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/app"
          strip_components: 2

      # 2. Ejecutar script remoto en EC2 usando la acción SSH oficial
      - name: Restart Spring Boot App via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ec2-user/app

            # Instala el JRE/JDK en la instancia si no esta presente
            command -v java >/dev/null 2>&1 || sudo dnf install -y java-21-amazon-corretto

            # Matar cualquier proceso previo en el puerto 8080 o java
            fuser -k 8080/tcp || true
            pkill -x java || true
            sleep 2

            # Iniciar la aplicación desacoplada del proceso SSH
            nohup java -jar /home/ec2-user/app/*.jar > /home/ec2-user/app/app.log 2>&1 &
            sleep 3
